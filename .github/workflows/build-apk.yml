name: Build Photo Gallery APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run end-to-end tests
        shell: bash
        run: |
          npm start -- --host 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/ > /dev/null; then
              npm run test:e2e
              exit $?
            fi
            sleep 2
          done

          echo "Angular development server did not start within 120 seconds."
          exit 1

      - name: Build Ionic application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PhotoGallery.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoGallery-APK
          path: PhotoGallery.apk
          if-no-files-found: error
          retention-days: 30
